name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
        fd: [true, false]
        treesitter: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["main", "master"]') || fromJSON('["main"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/workflows/ci.yml

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install fd
        if: matrix.fd
        run: |
          sudo apt-get install -y fd-find
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install deps
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git clone --depth=1 --branch ${{ matrix.treesitter }} https://github.com/nvim-treesitter/nvim-treesitter ~/.local/share/nvim/site/pack/vendor/start/nvim-treesitter

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Cache compiled parsers
        id: parser-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/site/parser
          key: parsers-${{ runner.os }}-${{ hashFiles('.github/actions/compile-parsers/action.yml') }}

      - name: Compile parsers
        if: steps.parser-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/compile-parsers

      - name: Run tests
        timeout-minutes: 10
        run: |
          echo "Running tests with neovim=${{ matrix.neovim }}, fd=${{ matrix.fd }}, treesitter=${{ matrix.treesitter }}"
          make test
