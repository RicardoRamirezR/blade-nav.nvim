name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
        fd: [true, false]
        treesitter: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["main", "master"]') || fromJSON('["main"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install fd
        if: matrix.fd
        run: |
          sudo apt-get install -y fd-find
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install deps
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git clone --depth=1 --branch ${{ matrix.treesitter }} https://github.com/nvim-treesitter/nvim-treesitter ~/.local/share/nvim/site/pack/vendor/start/nvim-treesitter

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Cache compiled parsers
        id: parser-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/site/parser
          key: parsers-${{ runner.os }}-${{ hashFiles('.github/actions/compile-parsers/action.yml') }}

      - name: Compile parsers
        if: steps.parser-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/compile-parsers

      - name: Run tests
        timeout-minutes: 10
        run: |
          echo "Running tests with neovim=${{ matrix.neovim }}, fd=${{ matrix.fd }}, treesitter=${{ matrix.treesitter }}"
          make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: |
          curl -L -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip stylua.zip
          sudo mv stylua /usr/local/bin/stylua
          stylua --version

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Check formatting (stylua)
        run: stylua --check lua ftplugin scripts tests

      - name: Run luacheck
        run: luacheck lua ftplugin scripts tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Check vimdoc is up to date
        run: |
          make docs
          git diff --exit-code doc/
