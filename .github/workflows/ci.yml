name: CI
on:
  push:
    branches:
      - 2.0-beta-2
  pull_request:
    branches:
      - 2.0-beta-2
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [stable, nightly]
        fd: [true, false]
        treesitter: [main, master]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install deps
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim   ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git clone --depth=1 --branch ${{ matrix.treesitter }} https://github.com/nvim-treesitter/nvim-treesitter   ~/.local/share/nvim/site/pack/vendor/start/nvim-treesitter

      - name: Install tree-sitter CLI
        run: |
          npm install -g tree-sitter-cli

      - name: Install and compile Treesitter parsers
        run: |
          mkdir -p ~/.local/share/nvim/site/parser

          # HTML parser
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-html   /tmp/tree-sitter-html
          cd /tmp/tree-sitter-html
          tree-sitter generate
          gcc -o ~/.local/share/nvim/site/parser/html.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2

          # PHP parser
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-php   /tmp/tree-sitter-php
          cd /tmp/tree-sitter-php/php
          tree-sitter generate
          gcc -o ~/.local/share/nvim/site/parser/php.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2

          # Blade parser - INCLUDE scanner.c and external scanner files
          git clone --depth=1 https://github.com/EmranMR/tree-sitter-blade   /tmp/tree-sitter-blade
          cd /tmp/tree-sitter-blade
          tree-sitter generate
          # Check if scanner.c exists and compile accordingly
          if [ -f "src/scanner.c" ]; then
            gcc -o ~/.local/share/nvim/site/parser/blade.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2
          else
            # If there's an external scanner, include it
            gcc -o ~/.local/share/nvim/site/parser/blade.so -shared src/parser.c src/scanner.c src/external_scanner.c -I./src -fPIC -O2 2>/dev/null || \
            gcc -o ~/.local/share/nvim/site/parser/blade.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2
          fi

          # Vue parser - skip npm install to avoid dependency issues
          git clone --depth=1 https://github.com/tree-sitter-grammars/tree-sitter-vue   /tmp/tree-sitter-vue
          cd /tmp/tree-sitter-vue
          # Copy HTML grammar files to local node_modules to satisfy dependency during generation
          mkdir -p node_modules/tree-sitter-html
          cp -r /tmp/tree-sitter-html/grammar.js node_modules/tree-sitter-html/ 2>/dev/null || echo "HTML grammar.js not found, continuing..."
          tree-sitter generate
          gcc -o ~/.local/share/nvim/site/parser/vue.so -shared src/scanner.c src/parser.c -I./src -fPIC -O2

      - name: Verify parsers installation
        run: |
          echo "Checking installed parsers..."
          ls -lh ~/.local/share/nvim/site/parser/
          for parser in blade php html vue; do
            if [ ! -f ~/.local/share/nvim/site/parser/$parser.so ]; then
              echo "ERROR: $parser.so not found!"
              exit 1
            fi
            echo "✓ $parser.so installed"
          done

      - name: Install fd (if enabled)
        if: matrix.fd == true
        run: |
          sudo apt-get install -y fd-find
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Run tests
        timeout-minutes: 10
        run: |
          echo "Running tests with neovim=${{ matrix.neovim }}, fd=${{ matrix.fd }}, treesitter=${{ matrix.treesitter }}"
          nvim --version
          make test
