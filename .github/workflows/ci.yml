name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Neovim ${{ matrix.neovim }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: ${{ matrix.neovim }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find findutils luarocks
          luarocks install busted

      - name: Run tests (fd branch)
        run: |
          make test

  test-no-fd:
    runs-on: ubuntu-latest
    continue-on-error: true   # 👈 allows this job to fail without breaking CI
    strategy:
      matrix:
        neovim: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Neovim ${{ matrix.neovim }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: ${{ matrix.neovim }}

      - name: Install dependencies (without fd)
        run: |
          sudo apt-get update
          sudo apt-get install -y findutils luarocks
          luarocks install busted

      - name: Hide fd from PATH
        run: |
          echo "PATH=$(echo $PATH | sed 's|/usr/bin||g')" >> $GITHUB_ENV

      - name: Run tests (find branch)
        run: |
          make test

