name: "Install and compile Treesitter parsers"
description: "Build and install tree-sitter parsers for BladeNav"

runs:
  using: "composite"
  steps:
    - name: Install and compile Treesitter parsers
      shell: bash
      run: |
        set -e
        mkdir -p ~/.local/share/nvim/site/parser

        echo "→ Compiling HTML parser..."
        git clone --depth=1 --branch v0.23.2 https://github.com/tree-sitter/tree-sitter-html /tmp/tree-sitter-html
        cd /tmp/tree-sitter-html
        tree-sitter generate
        gcc -o ~/.local/share/nvim/site/parser/html.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2

        echo "→ Compiling PHP parser..."
        git clone --depth=1 --branch v0.24.2 https://github.com/tree-sitter/tree-sitter-php /tmp/tree-sitter-php
        cd /tmp/tree-sitter-php/php
        tree-sitter generate
        gcc -o ~/.local/share/nvim/site/parser/php.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2

        echo "→ Compiling Blade parser..."
        git clone --depth=1 --branch v0.12.3 https://github.com/EmranMR/tree-sitter-blade /tmp/tree-sitter-blade
        cd /tmp/tree-sitter-blade
        tree-sitter generate
        if [ -f "src/scanner.c" ]; then
          gcc -o ~/.local/share/nvim/site/parser/blade.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2
        else
          gcc -o ~/.local/share/nvim/site/parser/blade.so -shared src/parser.c -I./src -fPIC -O2
        fi

        echo "→ Compiling Vue parser..."
        git init -q /tmp/tree-sitter-vue
        git -C /tmp/tree-sitter-vue remote add origin https://github.com/tree-sitter-grammars/tree-sitter-vue
        git -C /tmp/tree-sitter-vue fetch --depth=1 origin ce8011a414fdf8091f4e4071752efc376f4afb08
        git -C /tmp/tree-sitter-vue checkout FETCH_HEAD
        cd /tmp/tree-sitter-vue
        mkdir -p node_modules/tree-sitter-html
        cp -r /tmp/tree-sitter-html/grammar.js node_modules/tree-sitter-html/ 2>/dev/null || echo "HTML grammar.js not found, continuing..."
        tree-sitter generate
        gcc -o ~/.local/share/nvim/site/parser/vue.so -shared src/scanner.c src/parser.c -I./src -fPIC -O2

        echo "→ Compiling JavaScript parser..."
        git clone --depth=1 --branch v0.25.0 https://github.com/tree-sitter/tree-sitter-javascript /tmp/tree-sitter-javascript
        cd /tmp/tree-sitter-javascript
        tree-sitter generate
        gcc -o ~/.local/share/nvim/site/parser/javascript.so -shared src/parser.c src/scanner.c -I./src -fPIC -O2

        echo "✓ All parsers compiled successfully"
